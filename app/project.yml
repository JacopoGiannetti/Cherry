  CherryShare:
    type: app-extension
    platform: iOS
    sources:
      - path: CherryShare
    resources:
      - path: CherryShare/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cherry.jacopogiannetti.app.share
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
    entitlements:
      path: CherryShare/CherryShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.cherry.jacopogiannetti.app]
    info:
      path: CherryShare/Info.plist
      properties:
        CFBundleDisplayName: Cherry
        UIUserInterfaceStyle: Light
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsAttachmentsWithMatchingTypeIdentifiers:
                - public.url
                - public.plain-text
                - public.text
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 10
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true

  CherryActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: CherryActivity
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cherry.jacopogiannetti.app.activity
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
    entitlements:
      path: CherryActivity/CherryActivity.entitlements
      properties:
        com.apple.security.application-groups: [group.com.cherry.jacopogiannetti.app]
    info:
      path: CherryActivity/Info.plist
      properties:
        CFBundleDisplayName: Cherry
        UIUserInterfaceStyle: Light
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
